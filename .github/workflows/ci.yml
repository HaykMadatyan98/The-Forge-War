name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tfw
          POSTGRES_PASSWORD: tfw_ci_test
          POSTGRES_DB: tfw
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U tfw -d tfw"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Generate Prisma client
        run: npm run db:generate -w @tfw/api
        env:
          DATABASE_URL: postgresql://tfw:tfw_ci_test@localhost:5433/tfw?schema=public

      - name: Apply migrations
        run: npm run db:deploy -w @tfw/api
        env:
          DATABASE_URL: postgresql://tfw:tfw_ci_test@localhost:5433/tfw?schema=public

      - name: Typecheck game engine
        run: npm run build -w @tfw/game

      - name: Unit tests
        run: npm test

      - name: Build API
        run: npm run build -w @tfw/api
        env:
          DATABASE_URL: postgresql://tfw:tfw_ci_test@localhost:5433/tfw?schema=public

      - name: Build Web
        run: npm run build -w @tfw/web
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8787/v1
